<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>판교 IoT혁신센터 일대 3D 조립 모형</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2440; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(20, 22, 36, 0.72); color: #fff; padding: 14px 16px 12px;
    border-radius: 12px; backdrop-filter: blur(6px); max-width: 340px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  }
  #hud h1 { font-size: 16px; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.2px; }
  #stages { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    font-size: 12px; padding: 4px 8px; border-radius: 999px;
    background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.55);
    transition: all .25s;
  }
  .chip.done { background: rgba(255,190,120,0.25); color: #ffd9b0; }
  .chip.now { background: #ff9f5a; color: #1d1d1d; font-weight: 700; }
  #stageDesc { font-size: 12px; color: rgba(255,255,255,0.75); margin-bottom: 10px; min-height: 16px; }
  .btns { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 0;
    background: #ff9f5a; color: #1a1a1a; font-weight: 700; cursor: pointer;
  }
  button.ghost { background: rgba(255,255,255,0.14); color: #fff; font-weight: 500; }
  button:hover { filter: brightness(1.08); }
  #bar { height: 3px; background: rgba(255,255,255,0.12); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: #ff9f5a; }
  #help {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(255,255,255,0.85); font-size: 12px; background: rgba(20,22,36,0.55);
    padding: 6px 12px; border-radius: 999px; white-space: nowrap;
  }
  .label {
    color: #fff; font-size: 13px; font-weight: 700; text-align: center; line-height: 1.25;
    text-shadow: 0 0 3px #000, 0 0 6px rgba(0,0,0,0.8);
    opacity: 0; transition: opacity .8s; pointer-events: none;
  }
  .label .pin {
    display: block; width: 12px; height: 12px; margin: 0 auto 3px; border-radius: 50%;
    background: #6b74c9; border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.6);
  }
  .label.show { opacity: 1; }
  @media (max-width: 600px) {
    #hud { top: 8px; left: 8px; right: 8px; max-width: none; padding: 8px 10px; }
    #hud h1 { display: none; }
    .chip { font-size: 11px; padding: 3px 6px; }
    #stages { margin-bottom: 6px; }
    #stageDesc { display: none; }
    button { font-size: 12px; padding: 6px 9px; }
    #bar { margin-top: 6px; }
    #help { display: none; }
    .label { font-size: 11px; }
  }
</style>

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* =========================================================
   0. 기본 설정
   ========================================================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd29a7c, 180, 520);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(-62, 78, 92);
{ // 세로로 긴 화면(휴대폰)에서는 조금 멀리서 보기
  const a = window.innerWidth / window.innerHeight;
  if (a < 1.2) camera.position.sub(new THREE.Vector3(6, 4, -24)).multiplyScalar(Math.min(2.2, 1.25 / a)).add(new THREE.Vector3(6, 4, -24));
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(6, 4, -24);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 15;
controls.maxDistance = 380;
controls.update();

/* =========================================================
   1. 해질녘 하늘 · 조명
   ========================================================= */
const sunDir = new THREE.Vector3(-0.86, 0.30, 0.42).normalize();

function makeSky(radius) {
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { sunDir: { value: sunDir } },
    vertexShader: `
      varying vec3 vWorld;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform vec3 sunDir;
      varying vec3 vWorld;
      void main(){
        vec3 dir = normalize(vWorld - cameraPosition);
        float h = dir.y;
        float s = max(dot(dir, sunDir), 0.0);
        vec3 horizonCool = vec3(0.86, 0.62, 0.58);
        vec3 horizonWarm = vec3(1.00, 0.60, 0.30);
        vec3 horizon = mix(horizonCool, horizonWarm, pow(s, 2.5));
        vec3 zenith = vec3(0.17, 0.22, 0.45);
        vec3 col = mix(horizon, zenith, smoothstep(0.0, 0.6, h));
        col = mix(col, vec3(0.42, 0.32, 0.30), smoothstep(0.0, -0.25, h));
        col += vec3(1.0, 0.80, 0.55) * pow(s, 900.0) * 3.0;
        col += vec3(1.0, 0.55, 0.25) * pow(s, 10.0) * 0.45;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 24), mat);
}
scene.add(makeSky(1500));

// 하늘을 환경맵으로 써서 유리·태양광 패널에 노을이 비치게
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(makeSky(50));
scene.environment = pmrem.fromScene(envScene, 0.03, 0.1, 100).texture;
scene.environmentIntensity = 0.55;

const hemi = new THREE.HemisphereLight(0xffd4b0, 0x3b3226, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffb27a, 3.2);
sun.position.copy(controls.target).addScaledVector(sunDir, 220);
sun.target.position.copy(controls.target);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera;
sc.left = -130; sc.right = 130; sc.top = 130; sc.bottom = -130; sc.near = 20; sc.far = 480;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.12;
scene.add(sun, sun.target);

/* =========================================================
   2. 좌표 변환 · 도형 유틸
   (항공사진 픽셀 좌표 → 3D 좌표, 1px = 0.1 단위)
   ========================================================= */
const S = 0.1, CX = 630, CY = 820;           // 원점 = 중앙 광장
const P = (px, py) => ({ x: (px - CX) * S, z: (py - CY) * S });
const area = pts => {                           // 셰이프 좌표(x, -z) 기준 부호 면적
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p.x * (-q.z) - q.x * (-p.z);
  }
  return a / 2;
};
const ccw = pts => (area(pts) > 0 ? pts : pts.slice().reverse());
const W = arr => ccw(arr.map(([a, b]) => P(a, b)));

function offset(pts, d) {                       // 다각형을 바깥(+)/안쪽(-)으로 d만큼 오프셋
  const n = pts.length, out = [];
  for (let i = 0; i < n; i++) {
    const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
    const ax = a.x, ay = -a.z, bx = b.x, by = -b.z, cx = c.x, cy = -c.z;
    let e1x = bx - ax, e1y = by - ay, l1 = Math.hypot(e1x, e1y) || 1; e1x /= l1; e1y /= l1;
    let e2x = cx - bx, e2y = cy - by, l2 = Math.hypot(e2x, e2y) || 1; e2x /= l2; e2y /= l2;
    const n1x = e1y, n1y = -e1x, n2x = e2y, n2y = -e2x;
    let mx = n1x + n2x, my = n1y + n2y; const ml = Math.hypot(mx, my);
    if (ml < 1e-6) { mx = n1x; my = n1y; } else { mx /= ml; my /= ml; }
    const k = 1 / Math.max(mx * n1x + my * n1y, 0.4);
    out.push({ x: bx + mx * d * k, z: -(by + my * d * k) });
  }
  return out;
}

function shapeOf(pts, holes = []) {
  const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, -p.z)));
  holes.forEach(h => s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p.x, -p.z)))));
  return s;
}
function extrudeGeo(pts, h, holes = []) {
  const g = new THREE.ExtrudeGeometry(shapeOf(pts, holes), { depth: h, bevelEnabled: false, curveSegments: 6 });
  g.rotateX(-Math.PI / 2);
  return g;
}
function mesh(geo, mat, y = 0, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.y = y; m.castShadow = cast; m.receiveShadow = true;
  return m;
}
function inPoly(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, zi = poly[i].z, xj = poly[j].x, zj = poly[j].z;
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
function segDist(px, pz, a, b) {
  const vx = b.x - a.x, vz = b.z - a.z, wx = px - a.x, wz = pz - a.z;
  const t = Math.max(0, Math.min(1, (wx * vx + wz * vz) / (vx * vx + vz * vz || 1)));
  return Math.hypot(px - (a.x + vx * t), pz - (a.z + vz * t));
}
function polyDist(x, z, poly) {
  if (inPoly(x, z, poly)) return 0;
  let d = Infinity;
  for (let i = 0; i < poly.length; i++) d = Math.min(d, segDist(x, z, poly[i], poly[(i + 1) % poly.length]));
  return d;
}
function sectorPx(cx, cy, r0, r1, a0, a1, n = 16) {   // 부채꼴(아치형 건물) 픽셀 좌표
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; pts.push([cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)]); }
  for (let i = n; i >= 0; i--) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; pts.push([cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)]); }
  return pts;
}
function perimeterPoints(poly, spacing) {
  const pts = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const len = Math.hypot(b.x - a.x, b.z - a.z);
    const n = Math.max(1, Math.round(len / spacing));
    for (let k = 0; k < n; k++) pts.push({ x: a.x + (b.x - a.x) * k / n, z: a.z + (b.z - a.z) * k / n });
  }
  return pts;
}
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

/* =========================================================
   3. 재질
   ========================================================= */
const M = {
  concrete: new THREE.MeshStandardMaterial({ color: 0xe8e3d8, roughness: 0.85 }),
  column:   new THREE.MeshStandardMaterial({ color: 0xd2ccc0, roughness: 0.7 }),
  podium:   new THREE.MeshStandardMaterial({ color: 0x9c958a, roughness: 0.9 }),
  glass:    new THREE.MeshStandardMaterial({ color: 0x3e5a70, metalness: 0.85, roughness: 0.12, envMapIntensity: 1.4 }),
  glassLt:  new THREE.MeshStandardMaterial({ color: 0x86a8bf, metalness: 0.7, roughness: 0.1, envMapIntensity: 1.3 }),
  louver:   new THREE.MeshStandardMaterial({ color: 0xbab3a6, roughness: 0.6, metalness: 0.2 }),
  roof:     new THREE.MeshStandardMaterial({ color: 0xb8b0a1, roughness: 0.95 }),
  parapet:  new THREE.MeshStandardMaterial({ color: 0xeeebe4, roughness: 0.8 }),
  green:    new THREE.MeshStandardMaterial({ color: 0x6d7c45, roughness: 1 }),
  panel:    new THREE.MeshStandardMaterial({ color: 0x1b2742, metalness: 0.6, roughness: 0.28, envMapIntensity: 1.2 }),
  equip:    new THREE.MeshStandardMaterial({ color: 0xc8c8c2, roughness: 0.6, metalness: 0.3 }),
  heli:     new THREE.MeshStandardMaterial({ color: 0x4f8d6b, roughness: 0.8 }),
  white:    new THREE.MeshStandardMaterial({ color: 0xf5f4ef, roughness: 0.6 }),
  steel:    new THREE.MeshStandardMaterial({ color: 0x8d8f93, roughness: 0.5, metalness: 0.6 }),
  teal:     new THREE.MeshStandardMaterial({ color: 0x4f9e8c, roughness: 0.8 }),
  gray:     new THREE.MeshStandardMaterial({ color: 0xa9adb0, roughness: 0.8 }),
  road:     new THREE.MeshStandardMaterial({ color: 0x3b3c41, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
  walk:     new THREE.MeshStandardMaterial({ color: 0xa9a297, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
  pave:     new THREE.MeshStandardMaterial({ color: 0xb0a896, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
  paveLt:   new THREE.MeshStandardMaterial({ color: 0xcdbf97, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }),
  line:     new THREE.MeshStandardMaterial({ color: 0xf2efe6, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }),
  yellow:   new THREE.MeshStandardMaterial({ color: 0xe8c14a, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }),
};

/* =========================================================
   4. 건물 평면 (항공사진에서 따낸 윤곽, 픽셀 좌표)
   ========================================================= */
const FH = 1.5;      // 층고
const T = 0.32;      // 슬래브 두께
const BASE = 0.6;    // 기단 높이

const NORTH = W([[108,374],[200,300],[320,228],[440,175],[550,135],[680,110],[775,100],[792,122],[830,126],[846,166],[882,172],[891,282],[894,340],[850,356],[760,396],[640,440],[520,470],[390,495],[262,506],[200,470],[140,430]]);
const NORTH_HOLE = W([[540,228],[622,214],[632,340],[552,350]]);
const SE = W([[690,440],[740,470],[800,522],[835,565],[930,650],[1050,745],[1150,820],[1215,870],[1226,985],[1150,990],[1060,965],[960,920],[870,860],[800,790],[750,720],[725,660],[710,590],[695,520],[675,470]]);
const JUNC = W([[560,478],[688,448],[705,560],[645,612],[566,600]]);
const AI = W([[398,532],[552,506],[556,592],[404,612]]);
const WEST = W(sectorPx(600, 860, 205, 285, 185, 235, 14));
const CTX_B = W([[-200,735],[70,715],[140,770],[240,885],[245,1065],[-200,1065]]);

const buildings = [
  { key: 'north', name: 'IoT혁신센터', pts: NORTH, holes: [NORTH_HOLE], floors: 8 },
  { key: 'se',    name: '지능형ICT융합연구센터', pts: SE, floors: 6 },
  { key: 'junc',  name: '중앙 연결동', pts: JUNC, floors: 6 },
  { key: 'ai',    name: 'AI데이터안심활용센터', pts: AI, floors: 4, roofGlass: true },
  { key: 'west',  name: '서측 저층동', pts: WEST, floors: 2, roofGreen: true },
];
const roofTop = b => BASE + b.floors * FH + 0.45;

// 도로(중심선)
const ROAD_LINE = [[-260,306],[0,545],[80,620],[150,700],[230,810],[300,910],[360,1000],[420,1080],[540,1320]].map(([a, b]) => P(a, b));
function ribbon(line, half, side = 0) {          // 폴리라인을 띠 다각형으로
  const L = [], R = [];
  for (let i = 0; i < line.length; i++) {
    const a = line[Math.max(0, i - 1)], b = line[Math.min(line.length - 1, i + 1)];
    let dx = b.x - a.x, dz = b.z - a.z; const l = Math.hypot(dx, dz); dx /= l; dz /= l;
    const nx = dz, nz = -dx;  // 진행방향 기준 동쪽(오른쪽 위)
    L.push({ x: line[i].x + nx * (side + half), z: line[i].z + nz * (side + half) });
    R.push({ x: line[i].x + nx * (side - half), z: line[i].z + nz * (side - half) });
  }
  return ccw(L.concat(R.reverse()));
}
const ROAD = ribbon(ROAD_LINE, 2.6);
const WALK = ribbon(ROAD_LINE, 4.4);

// 평탄해야 하는 영역 (산이 올라오면 안 되는 곳)
const C2 = P(600, 860);                          // 아치 광장 중심
const flatZones = [...buildings.map(b => offset(b.pts, 1.2)), WALK, CTX_B,
  W(sectorPx(600, 860, 0, 205, 0, 360, 36))];

/* =========================================================
   5. 지형 (산 + 숲)
   ========================================================= */
function forestMask(x, z) {
  const ang = Math.atan2(z, x) * 180 / Math.PI;    // 광장 기준 방위각
  return smooth(-165, -148, ang) * (1 - smooth(6, 20, ang));
}
function flatDist(x, z) {
  let d = Infinity;
  for (const p of flatZones) { d = Math.min(d, polyDist(x, z, p)); if (d === 0) break; }
  return d;
}
function heightAt(x, z, d = flatDist(x, z)) {
  const m = forestMask(x, z);
  if (m <= 0) return 0;
  const noise = Math.sin(x * 0.13) * Math.cos(z * 0.11) * 1.1 + Math.sin(x * 0.05 + z * 0.07) * 1.6;
  return Math.max(0, m * (11 * smooth(3, 30, d) + noise * smooth(3, 14, d)));
}

const TS = 300, TN = 170, TCX = 5, TCZ = -20;
const terrainGeo = new THREE.PlaneGeometry(TS, TS, TN, TN);
terrainGeo.rotateX(-Math.PI / 2);
terrainGeo.translate(TCX, 0, TCZ);
{
  const pos = terrainGeo.attributes.position, cols = [];
  const lawn = new THREE.Color(0x667f4c), forest = new THREE.Color(0x2e4626), soil = new THREE.Color(0x6b5e45), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const d = flatDist(x, z);
    const h = heightAt(x, z, d);
    pos.setY(i, h);
    const f = forestMask(x, z) * smooth(1.5, 7, d);
    c.copy(lawn).lerp(forest, f);
    if (f > 0.05 && f < 0.6) c.lerp(soil, 0.25 * (1 - Math.abs(f - 0.3) / 0.3));
    const hsh = Math.sin(i * 12.9898 + 78.233) * 43758.5453; const jitter = (hsh - Math.floor(hsh) - 0.5) * 0.05;
    c.offsetHSL(0, 0, jitter);
    cols.push(c.r, c.g, c.b);
  }
  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  terrainGeo.computeVertexNormals();
}
const terrain = mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), 0, false);

// 나무 (인스턴싱)
const trees = new THREE.Group();
{
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const mat = new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true });
  const list = [];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let tries = 0; tries < 9000 && list.length < 1900; tries++) {
    const x = TCX + (rnd() - 0.5) * TS * 0.96, z = TCZ + (rnd() - 0.5) * TS * 0.96;
    const m = forestMask(x, z); if (m < 0.35 || rnd() > m) continue;
    const d = flatDist(x, z); if (d < 3.2) continue;
    list.push({ x, z, y: heightAt(x, z, d), r: 1.3 + rnd() * 1.3, kind: 0 });
  }
  // 도로변 벚나무
  for (let i = 1; i < 7; i++) {
    const a = ROAD_LINE[i], b = ROAD_LINE[i + 1];
    const len = Math.hypot(b.x - a.x, b.z - a.z), dx = (b.x - a.x) / len, dz = (b.z - a.z) / len;
    for (let s = 1; s < len; s += 3.4) for (const side of [-5.3, 5.3]) {
      const x = a.x + dx * s + dz * side, z = a.z + dz * s - dx * side;
      if (flatZones.slice(0, 5).some(p => polyDist(x, z, p) < 1.5)) continue;
      if (polyDist(x, z, CTX_B) < 1.2) continue;
      list.push({ x, z, y: 0, r: 1.0 + rnd() * 0.5, kind: rnd() < 0.7 ? 1 : 2 });
    }
  }
  const inst = new THREE.InstancedMesh(geo, mat, list.length);
  const dummy = new THREE.Object3D(), col = new THREE.Color();
  const greens = [0x2f4d2a, 0x3a5a2e, 0x284223, 0x45632f, 0x35552b];
  list.forEach((t, i) => {
    dummy.position.set(t.x, t.y + t.r * (t.kind ? 1.5 : 0.9), t.z);
    dummy.rotation.set(rnd(), rnd() * 6, rnd());
    dummy.scale.set(t.r, t.r * (t.kind ? 0.9 : 1.25), t.r);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
    col.setHex(t.kind === 1 ? 0xf1c6d2 : t.kind === 2 ? 0x8fae63 : greens[i % greens.length]);
    inst.setColorAt(i, col);
  });
  inst.castShadow = true; inst.receiveShadow = true;
  trees.add(inst);
  // 벚나무 줄기
  const trunks = list.filter(t => t.kind);
  const tInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.2, 1.6, 6), new THREE.MeshStandardMaterial({ color: 0x5b4636 }), trunks.length);
  trunks.forEach((t, i) => { dummy.position.set(t.x, 0.8, t.z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); tInst.setMatrixAt(i, dummy.matrix); });
  tInst.castShadow = true;
  trees.add(tInst);
}

function panelField(region, angleDeg, excl, y, { w = 1.9, d = 1.0, pu = 2.05, pv = 1.55, tilt = 0.18 } = {}) {
  const th = angleDeg * Math.PI / 180, dx = Math.cos(th), dz = Math.sin(th), qx = -dz, qz = dx;
  let cx = 0, cz = 0; region.forEach(p => { cx += p.x; cz += p.z; }); cx /= region.length; cz /= region.length;
  let R = 0; region.forEach(p => { R = Math.max(R, Math.hypot(p.x - cx, p.z - cz)); });
  const out = [];
  for (let v = -R; v <= R; v += pv) for (let u = -R; u <= R; u += pu) {
    const x = cx + u * dx + v * qx, z = cz + u * dz + v * qz;
    const corners = [[1, 1], [1, -1], [-1, 1], [-1, -1]].map(([a, b]) => ({ x: x + a * w / 2 * dx + b * d / 2 * qx, z: z + a * w / 2 * dz + b * d / 2 * qz }));
    if (!corners.every(c => inPoly(c.x, c.z, region))) continue;
    if (excl.some(e => inPoly(x, z, e) || corners.some(c => inPoly(c.x, c.z, e)))) continue;
    out.push({ x, z, v, u });
  }
  out.sort((a, b) => a.v - b.v || a.u - b.u);
  const geo = new THREE.BoxGeometry(w, 0.08, d);
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, -th, 0, 'YXZ'));
  const chunks = [];
  for (let i = 0; i < out.length; i += 26) {
    const slice = out.slice(i, i + 26);
    const im = new THREE.InstancedMesh(geo, M.panel, slice.length);
    const mtx = new THREE.Matrix4();
    slice.forEach((p, k) => { mtx.compose(new THREE.Vector3(p.x, y, p.z), q, new THREE.Vector3(1, 1, 1)); im.setMatrixAt(k, mtx); });
    im.castShadow = true; im.receiveShadow = true;
    chunks.push(im);
  }
  return chunks;
}

document.getElementById('speed').onclick = e => {
  speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
  e.target.textContent = `속도 ${speed}×`;
};

const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeBounce = p => {          // 살짝 '쿵' 하고 내려앉는 느낌
  if (p < 0.8) return easeOut(p / 0.8) * 1.0;
  const q = (p - 0.8) / 0.2;
  return 1 + Math.sin(q * Math.PI) * 0.012;
};

function applyTimeline() {
  for (const pt of parts) {
    const { obj, start, dur, type, h } = pt;
    if (t < start) { obj.visible = false; continue; }
    obj.visible = true;
    const p = Math.min(1, (t - start) / dur);
    if (type === 'grow') {
      obj.scale.y = Math.max(0.001, easeOut(p));
    } else {
      const k = easeBounce(p);
      obj.position.y = obj.userData.baseY + h * (1 - k);
    }
  }
  let cur = -1;
  stages.forEach((s, i) => { if (t >= s.start) cur = i; });
  const done = t >= END;
  stages.forEach((s, i) => {
    s.el.className = 'chip' + (done || i < cur ? ' done' : i === cur ? ' now' : '');
  });
  descEl.textContent = done ? '완성! 마우스로 돌려 보세요' : stages[cur].desc;
  barFill.style.width = `${Math.min(100, (t / END) * 100)}%`;
  labels.forEach(l => l.classList.toggle('show', done));
}

const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (t < END) t = Math.min(END, t + dt * speed);
  applyTimeline();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
