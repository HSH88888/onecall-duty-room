# Supabase 무료 플랜은 7일 동안 DB 활동이 없으면 프로젝트를 일시중지합니다.
# 3일마다 원콜 서버의 /api/ping 을 호출해 DB에 가벼운 요청을 보냅니다.
name: Keep Supabase alive

on:
  schedule:
    - cron: "17 0 */3 * *"   # 3일마다 09:17 (한국시간)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OneCall → Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            "https://onecall-duty-room-bzj6.vercel.app/api/ping"
