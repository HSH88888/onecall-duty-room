<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가상 부대 3D 배치도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(31,40,31,.86);
  --line: rgba(232,226,204,.14);
  --ink: #ece7d4;
  --ink-soft: #b9b39c;
  --chip: rgba(232,226,204,.08);
  --amber: #e2a43b;
  --alert: #d93a2b;
  --label-bg: #ece7d4;
  --label-ink: #1f281f;
  --bg: #c9d3cf;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(18,24,18,.9); --line: rgba(232,226,204,.1); --ink:#e6e1cd; --ink-soft:#a39e88;
    --chip: rgba(232,226,204,.07); --label-bg:#1f281f; --label-ink:#e6e1cd; --bg:#0e120e; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --panel: rgba(18,24,18,.9); --line: rgba(232,226,204,.1); --ink:#e6e1cd; --ink-soft:#a39e88;
  --chip: rgba(232,226,204,.07); --label-bg:#1f281f; --label-ink:#e6e1cd; --bg:#0e120e; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;border:0;
  background:var(--label-bg);color:var(--label-ink);font:500 12.5px/1 "IBM Plex Sans KR",sans-serif;
  padding:6px 9px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:opacity .2s}
.lbl small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.55;margin-right:6px}
.lbl.sel{outline:2px solid var(--amber);outline-offset:1px}
.lbl.alert{background:var(--alert);color:#fff}
.lbl.alert small{opacity:.85}
.lbl.alert::before{content:"";position:absolute;inset:-4px;border-radius:9px;border:2px solid var(--alert);animation:ping 1.4s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.lbl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.panel{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.22)}
.top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.top>*{pointer-events:auto}
.title{padding:11px 16px 12px;border-radius:12px}
.title .code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);letter-spacing:.08em}
.title h1{margin:3px 0 0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.title p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)}
.tools{display:flex;gap:4px;padding:5px;border-radius:12px}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
.tools button{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--chip);color:var(--ink)}
.tools button[aria-pressed="true"]{background:var(--amber);color:#1f281f}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

#banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:7;
  display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;border-radius:12px;background:var(--alert);color:#fff;
  box-shadow:0 8px 28px rgba(160,20,10,.35);max-width:calc(100% - 24px)}
#banner[hidden]{display:none}
#banner .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;background:rgba(0,0,0,.2);padding:3px 6px;border-radius:4px;flex:none}
#banner .txt{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner button{flex:none;font-size:12.5px;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.18);color:#fff}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column;align-items:center;gap:10px}
#info{pointer-events:auto;align-self:flex-start;width:min(360px,100%);padding:14px 16px 15px;border-radius:12px;position:relative}
#info[hidden]{display:none}
#info .code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);letter-spacing:.08em}
#info h2{margin:3px 30px 0 0;font-size:18px;font-weight:700}
#info .facts{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)}
#info .desc{margin:8px 0 0;font-size:13.5px;line-height:1.6}
#info .status{margin:10px 0 0;font-size:13px;padding:8px 10px;border-radius:8px;background:rgba(217,58,43,.18);border-left:3px solid var(--alert)}
#info .status[hidden]{display:none}
#info .actions{display:flex;gap:8px;margin-top:12px}
#info .close{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--ink-soft)}
.btn-alert{background:var(--alert);color:#fff;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:8px}
.btn-ghost{background:var(--chip);color:var(--ink);font-size:13.5px;padding:8px 14px;border-radius:8px}
.chips{pointer-events:auto;display:flex;gap:4px;overflow-x:auto;padding:5px;border-radius:12px;max-width:100%;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:13px;padding:8px 12px;border-radius:8px;color:var(--ink)}
.chip:hover{background:var(--chip)}
.chip[aria-current="true"]{background:var(--amber);color:#1f281f}
.chip.alert{box-shadow:inset 0 0 0 2px var(--alert)}
body.minimal .title, body.minimal .chips{display:none}
.cpin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:1.5px solid #6fc3e8;background:rgba(14,22,28,.88);color:#cfeaf6;
  font:500 10.5px/1 "IBM Plex Mono",monospace;padding:4px 5px 4px 4px;border-radius:999px;display:flex;align-items:center;gap:3px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.3);transition:opacity .2s}
.cpin svg{width:11px;height:11px;flex:none}
.cpin.live{border-color:#4bc48f;color:#c9f2de}
.cpin.sel{outline:2px solid var(--amber);outline-offset:1px}
.cpin.warn{background:var(--amber);border-color:var(--amber);color:#1f281f}
.cpin.hit{background:var(--alert);border-color:#fff;color:#fff}
.cpin.hit::before{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--alert);animation:ping 1.4s ease-out infinite}
.cpin:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
body.nocam .cpin{display:none}
#info .btn-open{background:#6fc3e8;color:#0e161c;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:8px}
#info .btn-open[hidden],#info .btn-alert[hidden]{display:none}
#info .actions{flex-wrap:wrap}
#info .btn-drone{background:#6fc3e8;color:#0e161c;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:8px}
#info .btn-drone[hidden]{display:none}
/* ===== 드론 카메라 모드 ===== */
#drone{position:fixed;inset:0;z-index:8;pointer-events:none;color:#eafff3;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.85)}
#drone[hidden]{display:none}
body.drone #labels,body.drone #camPins,body.drone .top,body.drone .bottom,body.drone #banner{display:none}
body.drone.nvg canvas#c{filter:grayscale(1) sepia(1) hue-rotate(62deg) saturate(3.2) brightness(1.9) contrast(1.15)}
#drone .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);opacity:.55}
#drone .vig{position:absolute;inset:0;box-shadow:inset 0 0 140px 30px rgba(0,0,0,.55)}
#drone .cnr{position:absolute;width:34px;height:34px;border:2px solid rgba(234,255,243,.85)}
#drone .cnr.a{left:14px;top:14px;border-right:0;border-bottom:0}#drone .cnr.b{right:14px;top:14px;border-left:0;border-bottom:0}
#drone .cnr.c{left:14px;bottom:14px;border-right:0;border-top:0}#drone .cnr.d{right:14px;bottom:14px;border-left:0;border-top:0}
#drone .cross{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border:1.5px solid rgba(234,255,243,.6);border-radius:50%}
#drone .cross::before,#drone .cross::after{content:"";position:absolute;background:rgba(234,255,243,.75)}
#drone .cross::before{left:50%;top:-14px;bottom:-14px;width:1.5px;margin-left:-.75px;clip-path:polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%)}
#drone .cross::after{top:50%;left:-14px;right:-14px;height:1.5px;margin-top:-.75px;clip-path:polygon(0 0,30% 0,30% 100%,0 100%,0 0,70% 0,70% 100%,100% 100%,100% 0)}
#drone .tl{position:absolute;left:28px;top:26px;display:flex;flex-direction:column;gap:5px}
#drone .tr{position:absolute;right:28px;top:26px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;text-align:right}
#drone .rec{display:flex;align-items:center;gap:7px;font-weight:500;letter-spacing:.06em}
#drone .rec i{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:drBlink 1s steps(1) infinite}
@keyframes drBlink{50%{opacity:.15}}
#drone .src{font-size:10.5px;opacity:.8;font-family:"IBM Plex Sans KR",sans-serif}
#drone .tele{position:absolute;left:28px;bottom:74px;display:grid;grid-template-columns:auto auto;gap:3px 12px;align-items:baseline}
#drone .tele span{opacity:.7;font-size:10.5px;letter-spacing:.08em}
#drone .tele b{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
#drone .tgt{position:absolute;left:50%;top:26px;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;max-width:46%}
#drone .tgt b{font:700 15px "IBM Plex Sans KR",sans-serif;background:rgba(10,18,14,.6);padding:5px 12px;border-radius:7px;border:1px solid rgba(234,255,243,.35);white-space:nowrap}
#drone .tgt b.hot{border-color:#ff5a52;color:#ffb3ad}
#drone .tgt span{font:500 12px "IBM Plex Sans KR",sans-serif;opacity:.9}
#drone .stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,58px);font:700 14px "IBM Plex Sans KR",sans-serif;padding:7px 14px;border-radius:8px;background:rgba(10,18,14,.75);border:1.5px solid #4bc48f;color:#bff5db;white-space:nowrap}
#drone .stamp.bad{border-color:#ff5a52;color:#ffc2bd}
#drone .stamp[hidden]{display:none}
#drone .bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 20px;pointer-events:auto;text-shadow:none}
#drone .bar button{font:500 13.5px "IBM Plex Sans KR",sans-serif;padding:9px 14px;border-radius:9px;background:rgba(14,22,18,.82);color:#eafff3;border:1px solid rgba(234,255,243,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#drone .bar button[hidden]{display:none}
#drone .bar .ok{border-color:#4bc48f;color:#bff5db}#drone .bar .bad{border-color:#ff5a52;color:#ffc2bd}
#drone .bar .back{background:#ece7d4;color:#1f281f;border-color:#ece7d4}
#drone .bar button[aria-pressed="true"]{background:#eafff3;color:#0e1612}
#drPad{position:absolute;right:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);display:grid;grid-template-columns:repeat(3,68px) 10px 80px;grid-template-rows:repeat(3,42px);gap:5px;pointer-events:auto;text-shadow:none;touch-action:none;-webkit-user-select:none;user-select:none}
#drPad[hidden]{display:none}
#drPad button{white-space:nowrap;padding:0;font:500 12.5px "IBM Plex Sans KR",sans-serif;border-radius:9px;background:rgba(14,22,18,.82);color:#eafff3;border:1px solid rgba(234,255,243,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none}
#drPad button:active,#drPad button.on{background:#eafff3;color:#0e1612}
#drPad [data-j="up"]{grid-area:1/2}#drPad [data-j="left"]{grid-area:2/1}#drPad [data-j="right"]{grid-area:2/3}#drPad [data-j="down"]{grid-area:3/2}
#drPad [data-j="near"]{grid-area:1/5}#drPad [data-j="far"]{grid-area:3/5}
#drPad i{grid-area:2/2;display:grid;place-items:center;font:500 10px "IBM Plex Mono",monospace;font-style:normal;color:rgba(234,255,243,.7);text-shadow:0 1px 3px rgba(0,0,0,.85)}
body.feed #drPad{display:none}
@media (max-width:600px){#drPad{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);grid-template-columns:repeat(3,60px) 6px 70px;grid-template-rows:repeat(3,40px)}#drPad button{font-size:12px}}
#droneNoise{position:fixed;inset:0;width:100%;height:100%;z-index:9;image-rendering:pixelated;pointer-events:none;transition:opacity .35s}
#droneNoise[hidden]{display:none}
#droneLink{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;font:500 14px "IBM Plex Mono",monospace;color:#eafff3;background:rgba(0,0,0,.6);padding:10px 16px;border-radius:8px;letter-spacing:.04em;pointer-events:none;white-space:nowrap}
#droneLink[hidden]{display:none}
/* 영상 전용(feed) 모드: 다른 화면 안에 작게 넣을 때. 조작 버튼은 바깥 화면이 맡는다 */
body.feed #drone .bar{display:none}
body.feed #drone{font-size:10.5px}
body.feed #drone .cnr{width:20px;height:20px;border-width:1.5px}
body.feed #drone .cnr.a,body.feed #drone .cnr.b{top:8px}body.feed #drone .cnr.c,body.feed #drone .cnr.d{bottom:8px}
body.feed #drone .cnr.a,body.feed #drone .cnr.c{left:8px}body.feed #drone .cnr.b,body.feed #drone .cnr.d{right:8px}
body.feed #drone .tl{left:16px;top:14px;gap:3px}body.feed #drone .tr{right:16px;top:14px;gap:3px}
body.feed #drone .tgt{top:12px}body.feed #drone .tgt b{font-size:12px;padding:3px 8px}body.feed #drone .tgt span{font-size:10.5px}
body.feed #drone .tele{left:16px;bottom:14px;gap:1px 8px}body.feed #drone .tele b{font-size:12px}body.feed #drone .tele span{font-size:9.5px}
body.feed #drone .src{font-size:9.5px}
body.feed #drone .cross{width:44px;height:44px;margin:-22px 0 0 -22px}
body.feed #drone .stamp{font-size:12px;padding:5px 10px;transform:translate(-50%,40px)}
body.feed #drone .vig{box-shadow:inset 0 0 70px 12px rgba(0,0,0,.5)}
body.feed #droneLink{font-size:12px;padding:7px 12px}
@media (max-width:470px){body.feed #drone .tr .src,body.feed #drone .tgt span{display:none}body.feed #drone .tgt{top:auto;bottom:12px;left:auto;right:16px;transform:none;max-width:60%}}
@media (max-width:600px){#drone .tele{bottom:112px}#drone .tgt{top:64px;max-width:80%}#drone .cross{width:48px;height:48px;margin:-24px 0 0 -24px}#drone .tr .src{display:none}}
@media (prefers-reduced-motion: reduce){#drone .rec i{animation:none}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:9;background:var(--bg);color:var(--ink)}
@media (max-width:600px){ .title h1{font-size:17px} .title p{display:none} #banner{top:calc(env(safe-area-inset-top,0px) + 70px)} }
@media (prefers-reduced-motion: reduce){ .lbl.alert::before,.cpin.hit::before{animation:none} }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="가상 부대 3D 배치도"></canvas>
<div id="labels"></div>
<div id="camPins" style="position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden"></div>

<header class="top">
  <div class="title panel">
    <div class="code">DUTY MAP · 가상 부대</div>
    <h1>부대 3D 배치도</h1>
    <p>건물이나 카메라 핀을 누르면 정보가 나와요.</p>
  </div>
  <div class="tools panel" role="group" aria-label="보기 설정">
    <button id="btnHome">부대 전경</button>
    <button id="btnNight" aria-pressed="false">야간</button>
    <button id="btnLabels" aria-pressed="true">이름표</button>
    <button id="btnCams" aria-pressed="true">CCTV</button>
  </div>
</header>
<div id="banner" role="alert" hidden>
  <span class="tag">위기상황</span>
  <span class="txt" id="bannerTxt"></span>
  <button id="btnClearAll">모두 해제</button>
</div>

<div class="bottom">
  <section id="info" class="panel" hidden aria-live="polite">
    <button class="close" aria-label="정보 닫기">×</button>
    <div class="code" id="infoCode"></div>
    <h2 id="infoName"></h2>
    <p class="facts" id="infoFacts"></p>
    <p class="desc" id="infoDesc"></p>
    <p class="status" id="infoStatus" hidden></p>
    <div class="actions">
      <button class="btn-open" id="btnOpen" hidden>영상 보기</button>
      <button class="btn-alert" id="btnAlert">위기상황 표시</button>
      <button class="btn-ghost" id="btnFocus">가까이 보기</button>
      <button class="btn-drone" id="btnDrone">드론 보내기</button>
    </div>
  </section>
  <nav class="chips panel" id="chips" aria-label="건물로 이동"></nav>
</div>
<!-- 드론 카메라 HUD: 영상(아래 canvas)만 바꾸면 실제 드론 스트림에도 그대로 쓸 수 있는 층 -->
<div id="drone" hidden aria-live="polite">
  <div class="scan"></div><div class="vig"></div>
  <i class="cnr a"></i><i class="cnr b"></i><i class="cnr c"></i><i class="cnr d"></i>
  <div class="cross"></div>
  <div class="tl"><div class="rec"><i></i>REC · DRONE-01</div><div id="drClock">--:--:--</div><div id="drPhase">이륙 준비</div></div>
  <div class="tgt"><b id="drTgt"></b><span id="drMsg"></span></div>
  <div class="tr"><div>BAT <b id="drBat">96</b>%</div><div>SIG ▮▮▮▮▯ · GPS 14</div><div class="src" id="drSrc">영상 소스: 3D 시뮬레이션 (실제 적용 시 드론 실시간 영상)</div></div>
  <div class="tele"><span>ALT</span><b id="drAlt">0 m</b><span>SPD</span><b id="drSpd">0 km/h</b><span>DIST</span><b id="drDist">0 m</b></div>
  <div class="stamp" id="drStamp" hidden></div>
  <div id="drPad" role="group" aria-label="드론 조종" hidden>
    <button data-j="up" aria-label="위로">▲ 위</button><button data-j="left" aria-label="왼쪽으로">◀ 왼쪽</button><i>조종</i><button data-j="right" aria-label="오른쪽으로">오른쪽 ▶</button><button data-j="down" aria-label="아래로">▼ 아래</button>
    <button data-j="near" aria-label="가까이">가까이 ＋</button><button data-j="far" aria-label="멀리">멀리 －</button>
  </div>
  <div class="bar">
    <button id="drSkip">건너뛰기</button>
    <button id="drOrbit" aria-pressed="false" hidden>자동 선회</button>
    <button class="ok" id="drOk" hidden>이상 없음</button>
    <button class="bad" id="drBad" hidden>조치 필요</button>
    <button id="drCtl" aria-pressed="false" hidden>드론 조종</button>
    <button class="back" id="drHome">드론 복귀</button>
    <button id="drBack">드론 화면 종료</button>
  </div>
</div>

  const b = c ? { id: c.id, cam: c.id, name: c.loc, code: c.id, bid: bld ? bld.id : null, note: c.state === 'hit' ? `CCTV 화재 감지: ${c.msg || '확인 필요'}` : c.state === 'warn' ? `CCTV 의심 감지: ${c.msg || '분석 중'}` : `${c.id} 화면 확인 요청` }

  Object.assign(DR, { on: true, b, bat: 96, spd: 0, hud: 0, auto: false, result: null, now: 0, joy: {}, jv: [0, 0, 0] });
  // 벽에 달린 카메라: 그 벽면을 정면에서 본다 · 기둥 카메라: 카메라 뒤쪽에서 같은 방향을 본다
  if (c) { DR.tgt = c.pole ? new THREE.Vector3(c.at[0], 2, c.at[2]) : new THREE.Vector3(c.p[0], Math.max(2, c.p[1] * .7), c.p[2]); DR.R = c.pole ? 34 : 30; DR.H = c.pole ? 20 : 16; }
  else { DR.tgt = new THREE.Vector3(bld.center.x, Math.max(2, bld.box.max.y * .5), bld.center.z); DR.R = bld.size * .75 + 24; DR.H = Math.max(20, bld.box.max.y + 13); }
  drP0.set(hq.center.x + 6, DR_ALT, hq.center.z);
  const dir = c ? new THREE.Vector3((c.pole ? 1 : -1) * (c.p[0] - c.at[0]), 0, (c.pole ? 1 : -1) * (c.p[2] - c.at[2])) : new THREE.Vector3(drP0.x - DR.tgt.x, 0, drP0.z - DR.tgt.z);

  if (DR.head.lengthSq() < 4) DR.head.set(DR.tgt.x - drP0.x, 0, DR.tgt.z - drP0.z);
  if (DR.head.lengthSq() < 4) DR.head.set(0, 0, 1);
  DR.head.normalize(); DR.L = Math.max(.1, drP0.distanceTo(drP1)); DR.d = 0; DR.v = 0; DR.rot = 0;
  fly = null; controls.enabled = false; controls.autoRotate = false;
  document.body.classList.add('drone'); document.body.classList.toggle('nvg', $('btnNight').getAttribute('aria-pressed') === 'true');
  drEl.hidden = false; $('drStamp').hidden = true; $('drOrbit').setAttribute('aria-pressed', 'false');
  $('drTgt').textContent = `${b.code} ${b.name}`; $('drTgt').classList.toggle('hot', alerts.has(b.bid) || !!(c && c.state === 'hit'));

  camera.position.set(drP0.x, DR.homeY, drP0.z); drPrev.copy(camera.position); controls.target.copy(drAhead(drLook));
  drNoise.hidden = reduceMotion; drNoise.style.opacity = 1; drLink.hidden = false; drLink.textContent = '드론 영상 연결 중…';

}
function droneArrive() {

  controls.enabled = true; controls.autoRotate = DR.auto; controls.autoRotateSpeed = 0; DR.rot = 0;
  controls.minDistance = 18; controls.maxDistance = 130;
  drNoise.hidden = true; drLink.hidden = true;

}
function droneReport(ok) {
  if (!DR.on || DR.phase !== 'orbit') return;

  const st = $('drStamp'); st.hidden = false; st.classList.toggle('bad', !ok);
  st.textContent = `확인 결과: ${DR.result} · 기록됨`;
  if (!ok && DR.b.bid && !alerts.has(DR.b.bid)) { setAlert(DR.b.bid, '드론 확인: 조치 필요'); $('drTgt').classList.add('hot'); }

/* 복귀: 대대본부 옥상까지 날아가 착륙한 뒤 영상이 꺼진다 (끝나면 droneExit) */

function droneExit() {

  drPadShow(false);
  document.body.classList.remove('drone', 'nvg'); drEl.hidden = true; drNoise.hidden = true; drLink.hidden = true;
  drPost('return', { result });

function droneStep(dt) {
  const ph = DR.phase; DR.k += dt; DR.now += dt;
  if (ph === 'orbit') drJoyStep(dt);

    controls.target.copy(drAhead(drLook));
    if (DR.k > .9) drNoise.style.opacity = Math.max(0, 1 - (DR.k - .9) / .4);
    if (DR.k >= 1.3 || reduceMotion) { drNoise.hidden = true; drLink.hidden = true; drPhase('takeoff'); DR.y0 = camera.position.y; DR.vy = 0; }
  } else if (ph === 'takeoff') {

    camera.position.y = drP0.y + (drP1.y - drP0.y) * smooth(.55, 1, k);          // 마지막 구간에서 촬영 고도로 하강
    drAhead(drLook).lerp(DR.tgt, smooth(.3, .9, k)); controls.target.copy(drLook);   // 가까워지면 카메라가 목표로
    if (rem < .25) droneArrive();
  } else if (ph === 'return') {
    const rem = DR.L - DR.d, vt = Math.min(DR_VMAX, Math.sqrt(2 * DR_ACC * Math.max(0, rem)) + .4);
    DR.v += Math.max(-DR_ACC * dt, Math.min(DR_ACC * dt, vt - DR.v));
    DR.d = Math.min(DR.L, DR.d + DR.v * dt);
    const k = DR.d / DR.L;
    camera.position.lerpVectors(drR0, drR1, k);
    camera.position.y = drR0.y + (drR1.y - drR0.y) * smooth(0, .45, k);                 // 먼저 순항 고도로

    DR.vy += Math.max(-2.2 * dt, Math.min(2.2 * dt, vt - DR.vy));
    camera.position.y = Math.max(DR.homeY, camera.position.y - DR.vy * dt);
    controls.target.copy(drAhead(drLook));
    if (rem < .15) { drPhase('off'); if (!reduceMotion) { drNoise.hidden = false; drNoise.style.opacity = 1; } drLink.hidden = false; drLink.textContent = '착륙 완료 · 영상 종료'; }

  }
  // 계기판
  const v = camera.position.distanceTo(drPrev) / Math.max(dt, .001); drPrev.copy(camera.position);
  DR.spd += (v - DR.spd) * Math.min(1, dt * 4); DR.bat = Math.max(20, DR.bat - dt * .12);

    $('drAlt').textContent = `${camera.position.y.toFixed(0)} m`; $('drSpd').textContent = `${(DR.spd * 3.6).toFixed(0)} km/h`;

}
$('btnDrone').addEventListener('click', () => { if (selectedCam) droneStart(selectedCam.id); else if (selected) droneStart(selected.id); });
$('drSkip').addEventListener('click', () => { if (DR.on && DR.phase !== 'orbit' && !DR_BACK.includes(DR.phase)) droneArrive(); });
$('drOrbit').addEventListener('click', () => { if (!DR.on) return; DR.auto = !DR.auto; controls.autoRotate = DR.auto; DR.rot = 0; controls.autoRotateSpeed = 0; $('drPhase').textContent = DR.auto ? '현장 도착 · 선회 촬영' : '현장 도착 · 제자리 비행'; $('drOrbit').setAttribute('aria-pressed', String(DR.auto)); drPost('orbit'); });
$('drOk').addEventListener('click', () => droneReport(true));
$('drBad').addEventListener('click', () => droneReport(false));
$('drBack').addEventListener('click', droneExit);
$('drHome').addEventListener('click', droneReturn);
addEventListener('keydown', e => { if (e.key === 'Escape' && DR.on) droneExit(); });

/* ---------- 외부 연동 API ---------- */
window.BaseMap = {
  list: () => BUILDINGS.map(b => ({ id: b.id, name: b.name, code: b.code })),
  alert: (id, message) => setAlert(id, message),
  clear: id => clearAlert(id),
  focus: id => { const b = find(id); if (!b) return false; selectBuilding(b.id, true); return true; },
  select: id => selectBuilding(id, false),
  overview: () => { selectBuilding(null); flyTo(HOME.cam, HOME.tgt); },
  setNight: on => { $('btnNight').setAttribute('aria-pressed', String(!!on)); setNight(!!on); },
  cameras: () => CAMERAS.map(c => { const b = c.bid ? find(c.bid) : null; return { id: c.id, loc: c.loc, bid: c.bid, bname: b ? b.name : null, live: !!c.live, state: c.state }; }),
  camState: (id, state, message) => setCamState(id, state, message),
  focusCam: id => selectCamera(id, true),
  setCams: on => { $('btnCams').setAttribute('aria-pressed', String(!!on)); setCams(!!on); },
  drone: id => droneStart(id),
  droneExit: () => droneExit(),
  droneReturn: () => droneReturn(),
  droneState: () => DR.on ? { id: DR.b.id, name: DR.b.name, phase: DR.phase, result: DR.result } : null,
  active: () => [...alerts.entries()].map(([id, a]) => ({ id, name: find(id).name, message: a.message, since: a.since })),
};
window.addEventListener('message', e => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'alert') { const id = m.id || (findCam(m.cam) || {}).bid; setAlert(id, m.message); if (m.focus !== false) BaseMap.focus(id); }
  else if (m.type === 'cam-state') setCamState(m.id, m.state, m.message);
  else if (m.type === 'cam-focus') selectCamera(m.id, true);
  else if (m.type === 'cams') BaseMap.setCams(m.on);
  else if (m.type === 'drone') { if (m.exit) droneExit(); else droneStart(m.cam || m.id, m.back); }
  else if (m.type === 'drone-cmd') {                       // 바깥 화면의 버튼으로 조작
    if (m.cmd === 'skip') $('drSkip').click(); else if (m.cmd === 'orbit') $('drOrbit').click();
    else if (m.cmd === 'ok') droneReport(true); else if (m.cmd === 'bad') droneReport(false); else if (m.cmd === 'joy') drJoy(m.dir, m.hold); else if (m.cmd === 'return') droneReturn(); else if (m.cmd === 'exit') droneExit();
  }

  else if (m.type === 'focus') BaseMap.focus(m.id);

/* ---------- 렌더 ---------- */
function resize() { const w = innerWidth, h = innerHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
{ const c = HOME.cam.clone(); if (camera.aspect < .8) c.sub(HOME.tgt).multiplyScalar(1.5).add(HOME.tgt); camera.position.copy(c); controls.target.copy(HOME.tgt); controls.update(); chipBtns.all.setAttribute('aria-current', 'true'); }

const v = new THREE.Vector3();
function updateLabels() {
  if (labelsEl.style.display === 'none') return;
  const W = innerWidth, H = innerHeight, camDist = camera.position.distanceTo(controls.target);
  for (const b of BUILDINGS) {
    const el = b.label;
    v.copy(b.anchor).project(camera);
    if (v.z > 1 || Math.abs(v.x) > 1.2 || Math.abs(v.y) > 1.2) { el.style.opacity = 0; el.style.pointerEvents = 'none'; continue; }
    const dist = camera.position.distanceTo(b.anchor);
    const op = alerts.has(b.id) ? 1 : Math.max(0, Math.min(1, 1.6 - dist / Math.max(260, camDist * 1.8)));
    el.style.opacity = op; el.style.pointerEvents = op > .2 ? 'auto' : 'none';
    el.style.transform = `translate(-50%,-100%) translate(${((v.x * .5 + .5) * W).toFixed(1)}px,${((-v.y * .5 + .5) * H).toFixed(1)}px)`;
    el.style.zIndex = String(alerts.has(b.id) ? 20000 : 10000 - Math.round(dist));
  }
}
function updateCamPins() {
  if (!camsOn) return;
  const W = innerWidth, H = innerHeight, camDist = camera.position.distanceTo(controls.target);
  for (const c of CAMERAS) {
    const el = c.pin;
    v.copy(c.anchor).project(camera);
    if (v.z > 1 || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1) { el.style.opacity = 0; el.style.pointerEvents = 'none'; continue; }

    const op = hot ? 1 : Math.max(0, Math.min(1, 1.7 - dist / Math.max(250, camDist * 1.5)));
    el.style.opacity = op; el.style.pointerEvents = op > .2 ? 'auto' : 'none';
    el.style.transform = `translate(-50%,-100%) translate(${((v.x * .5 + .5) * W).toFixed(1)}px,${((-v.y * .5 + .5) * H).toFixed(1)}px)`;

}
let onScreen = true;
if ('IntersectionObserver' in window) new IntersectionObserver(es => { onScreen = es[es.length - 1].isIntersecting; }).observe(canvas);
const clock = new THREE.Clock();
let t = 0;
