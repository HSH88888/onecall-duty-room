function label(text,x,z,h,size,strong){
  const cv=document.createElement('canvas'),fs=52,pad=20,c0=cv.getContext('2d'); c0.font='700 '+fs+'px sans-serif';
  const w=Math.ceil(c0.measureText(text).width)+pad*2; cv.width=w; cv.height=fs+pad*1.4; const c=cv.getContext('2d');
  c.font='700 '+fs+'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif'; c.textAlign='center'; c.textBaseline='middle';
  const r=cv.height/2; c.fillStyle=strong?'rgba(76,122,46,.92)':'rgba(255,255,255,.9)'; c.beginPath(); c.moveTo(r,0); c.arcTo(w,0,w,cv.height,r); c.arcTo(w,cv.height,0,cv.height,r); c.arcTo(0,cv.height,0,0,r); c.arcTo(0,0,w,0,r); c.fill();
  c.fillStyle=strong?'#fff':'#2a3140'; c.fillText(text,w/2,cv.height/2+2);
  const tex=new T.CanvasTexture(cv); tex.minFilter=T.LinearFilter;
  const sp=new T.Sprite(new T.SpriteMaterial({map:tex,depthTest:false,transparent:true})); sp.scale.set(size*w/cv.height,size,1); sp.position.set(x-OX,h,z-OZ); sp.renderOrder=10; sp.userData.base=[sp.scale.x,sp.scale.y]; L.add(sp);
}

const tgt=new T.Vector3(0,0,-8); let th=-0.2, ph=0.85, rad=300, goal=null, spin=false;
function fit(){ const a=innerWidth/innerHeight; return a<1? 185/a+40 : 330; }
function place(){ ph=Math.max(0.02,Math.min(1.42,ph)); rad=Math.max(25,Math.min(1900,rad));
  camera.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th)); camera.lookAt(tgt); }
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize(); rad=fit();
const ptr=new Map(); let pd=0, pc=null;
function pan(dx,dy){ const k=rad*0.0016, r=new T.Vector3(Math.cos(th),0,-Math.sin(th)), f=new T.Vector3(Math.sin(th),0,Math.cos(th));
  tgt.addScaledVector(r,-dx*k).addScaledVector(f,-dy*k); tgt.x=Math.max(-390,Math.min(350,tgt.x)); tgt.z=Math.max(-210,Math.min(210,tgt.z)); }
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); goal=null; pd=0;});
canvas.addEventListener('pointermove',e=>{ const p=ptr.get(e.pointerId); if(!p)return; const dx=e.clientX-p.x,dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptr.size===1){ if(e.buttons===2||e.shiftKey) pan(dx,dy); else {th-=dx*0.007; ph-=dy*0.006;} }
  else if(ptr.size===2){ const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}; if(pd){rad*=pd/d; pan(c.x-pc.x,c.y-pc.y);} pd=d; pc=c; } });
['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,e=>{ptr.delete(e.pointerId); pd=0;}));
canvas.addEventListener('wheel',e=>{e.preventDefault(); rad*=Math.exp(e.deltaY*0.001); goal=null;},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

$('bAll').onclick=()=>{ top=false; $('bView').textContent='위에서 보기'; goal={th:-0.15,ph:0.7,rad:innerWidth<innerHeight?1250:760,tx:-10,tz:10}; };
$('bSpin').onclick=()=>{ spin=!spin; $('bSpin').classList.toggle('on',spin); };
$('bLab').onclick=()=>{ L.visible=!L.visible; $('bLab').classList.toggle('on',L.visible); };
let lastLs=0;
(function loop(){ if(goal){ if(goal.tx!==undefined){tgt.x+=(goal.tx-tgt.x)*0.1; tgt.z+=(goal.tz-tgt.z)*0.1;} th+=(goal.th-th)*0.1; ph+=(goal.ph-ph)*0.1; rad+=(goal.rad-rad)*0.1; if(Math.abs(goal.th-th)+Math.abs(goal.ph-ph)+Math.abs(goal.rad-rad)*0.01<0.003) goal=null; }
  else if(spin&&ptr.size===0) th+=0.0025;
  const ls=Math.max(1,Math.min(3.2,rad/190)); if(ls!==lastLs){ lastLs=ls; L.children.forEach(sp=>{const b=sp.userData.base; if(b) sp.scale.set(b[0]*ls,b[1]*ls,1);}); }
  place(); renderer.render(scene,camera); requestAnimationFrame(loop); })();
})();
