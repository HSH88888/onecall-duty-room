<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가상 부대 3D 배치도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(31,40,31,.86);
  --line: rgba(232,226,204,.14);
  --ink: #ece7d4;
  --ink-soft: #b9b39c;
  --chip: rgba(232,226,204,.08);
  --amber: #e2a43b;
  --alert: #d93a2b;
  --label-bg: #ece7d4;
  --label-ink: #1f281f;
  --bg: #c9d3cf;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(18,24,18,.9); --line: rgba(232,226,204,.1); --ink:#e6e1cd; --ink-soft:#a39e88;
    --chip: rgba(232,226,204,.07); --label-bg:#1f281f; --label-ink:#e6e1cd; --bg:#0e120e; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --panel: rgba(18,24,18,.9); --line: rgba(232,226,204,.1); --ink:#e6e1cd; --ink-soft:#a39e88;
  --chip: rgba(232,226,204,.07); --label-bg:#1f281f; --label-ink:#e6e1cd; --bg:#0e120e; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;border:0;
  background:var(--label-bg);color:var(--label-ink);font:500 12.5px/1 "IBM Plex Sans KR",sans-serif;
  padding:6px 9px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:opacity .2s}
.lbl small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.55;margin-right:6px}
.lbl.sel{outline:2px solid var(--amber);outline-offset:1px}
.lbl.alert{background:var(--alert);color:#fff}
.lbl.alert small{opacity:.85}
.lbl.alert::before{content:"";position:absolute;inset:-4px;border-radius:9px;border:2px solid var(--alert);animation:ping 1.4s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.lbl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.panel{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.22)}
.top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.top>*{pointer-events:auto}
.title{padding:11px 16px 12px;border-radius:12px}
.title .code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);letter-spacing:.08em}
.title h1{margin:3px 0 0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.title p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)}
.tools{display:flex;gap:4px;padding:5px;border-radius:12px}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
.tools button{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--chip);color:var(--ink)}
.tools button[aria-pressed="true"]{background:var(--amber);color:#1f281f}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

#banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:7;
  display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;border-radius:12px;background:var(--alert);color:#fff;
  box-shadow:0 8px 28px rgba(160,20,10,.35);max-width:calc(100% - 24px)}
#banner[hidden]{display:none}
#banner .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;background:rgba(0,0,0,.2);padding:3px 6px;border-radius:4px;flex:none}
#banner .txt{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner button{flex:none;font-size:12.5px;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.18);color:#fff}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column;align-items:center;gap:10px}
#info{pointer-events:auto;align-self:flex-start;width:min(360px,100%);padding:14px 16px 15px;border-radius:12px;position:relative}
#info[hidden]{display:none}
#info .code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);letter-spacing:.08em}
#info h2{margin:3px 30px 0 0;font-size:18px;font-weight:700}
#info .facts{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)}
#info .desc{margin:8px 0 0;font-size:13.5px;line-height:1.6}
#info .status{margin:10px 0 0;font-size:13px;padding:8px 10px;border-radius:8px;background:rgba(217,58,43,.18);border-left:3px solid var(--alert)}
#info .status[hidden]{display:none}
#info .actions{display:flex;gap:8px;margin-top:12px}
#info .close{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--ink-soft)}
.btn-alert{background:var(--alert);color:#fff;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:8px}
.btn-ghost{background:var(--chip);color:var(--ink);font-size:13.5px;padding:8px 14px;border-radius:8px}
.chips{pointer-events:auto;display:flex;gap:4px;overflow-x:auto;padding:5px;border-radius:12px;max-width:100%;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:13px;padding:8px 12px;border-radius:8px;color:var(--ink)}
.chip:hover{background:var(--chip)}
.chip[aria-current="true"]{background:var(--amber);color:#1f281f}
.chip.alert{box-shadow:inset 0 0 0 2px var(--alert)}
body.minimal .title, body.minimal .chips{display:none}
.cpin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:1.5px solid #6fc3e8;background:rgba(14,22,28,.88);color:#cfeaf6;
  font:500 10.5px/1 "IBM Plex Mono",monospace;padding:4px 5px 4px 4px;border-radius:999px;display:flex;align-items:center;gap:3px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.3);transition:opacity .2s}
.cpin svg{width:11px;height:11px;flex:none}
.cpin.live{border-color:#4bc48f;color:#c9f2de}
.cpin.sel{outline:2px solid var(--amber);outline-offset:1px}
.cpin.warn{background:var(--amber);border-color:var(--amber);color:#1f281f}
.cpin.hit{background:var(--alert);border-color:#fff;color:#fff}
.cpin.hit::before{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--alert);animation:ping 1.4s ease-out infinite}
.cpin:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
body.nocam .cpin{display:none}
#info .btn-open{background:#6fc3e8;color:#0e161c;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:8px}
#info .btn-open[hidden],#info .btn-alert[hidden]{display:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:9;background:var(--bg);color:var(--ink)}
@media (max-width:600px){ .title h1{font-size:17px} .title p{display:none} #banner{top:calc(env(safe-area-inset-top,0px) + 70px)} }
@media (prefers-reduced-motion: reduce){ .lbl.alert::before,.cpin.hit::before{animation:none} }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="가상 부대 3D 배치도"></canvas>
<div id="labels"></div>
<div id="camPins" style="position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden"></div>

<header class="top">
  <div class="title panel">
    <div class="code">DUTY MAP · 가상 부대</div>
    <h1>부대 3D 배치도</h1>
    <p>건물이나 카메라 핀을 누르면 정보가 나와요.</p>
  </div>
  <div class="tools panel" role="group" aria-label="보기 설정">
    <button id="btnNight" aria-pressed="false">야간</button>
    <button id="btnLabels" aria-pressed="true">이름표</button>
    <button id="btnCams" aria-pressed="true">CCTV</button>
  </div>
</header>
<div id="banner" role="alert" hidden>
  <span class="tag">위기상황</span>
  <span class="txt" id="bannerTxt"></span>
  <button id="btnClearAll">모두 해제</button>
</div>

<div class="bottom">
  <section id="info" class="panel" hidden aria-live="polite">
    <button class="close" aria-label="정보 닫기">×</button>
    <div class="code" id="infoCode"></div>
    <h2 id="infoName"></h2>
    <p class="facts" id="infoFacts"></p>
    <p class="desc" id="infoDesc"></p>
    <p class="status" id="infoStatus" hidden></p>
    <div class="actions">
      <button class="btn-open" id="btnOpen" hidden>영상 보기</button>
      <button class="btn-alert" id="btnAlert">위기상황 표시</button>
      <button class="btn-ghost" id="btnFocus">가까이 보기</button>
    </div>
  </section>
  <nav class="chips panel" id="chips" aria-label="건물로 이동"></nav>
</div>
<div id="err">이 브라우저에서는 WebGL을 사용할 수 없어 3D 배치도를 표시하지 못했어요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/*
  가상 부대 3D 배치도 — 외부에서 쓰는 방법

  같은 페이지에서:
    BaseMap.list()                       // [{id, name}, ...]
    BaseMap.alert('barracks1', '화재 연기 발생')   // id 또는 건물 이름 둘 다 가능
    BaseMap.clear('barracks1')           // 인자 없이 부르면 모두 해제
    BaseMap.focus('hq')                  // 카메라 이동
    window.addEventListener('basemap:select', e => console.log(e.detail))  // 건물 클릭

  iframe 으로 넣었을 때 (부모 페이지에서):
    frame.contentWindow.postMessage({ type: 'alert', id: '취사장', message: '가스 누출' }, '*')
    frame.contentWindow.postMessage({ type: 'clear' }, '*')
    frame.contentWindow.postMessage({ type: 'focus', id: 'ammo' }, '*')
    // 건물을 누르면 부모로 { type: 'building-select', id, name } 이 전달돼요.

  CCTV:
    BaseMap.cameras()                     // [{id, loc, bid, bname, live}, ...]
    BaseMap.camState('CAM-07', 'hit', '연기 · 불꽃 91%')   // 'warn' | 'hit' | 'normal'
    BaseMap.focusCam('CAM-07')
    postMessage({ type:'cam-state', id:'CAM-07', state:'hit', message:'...' })
    postMessage({ type:'cam-focus', id:'CAM-07' })
    postMessage({ type:'alert', cam:'CAM-07', message:'...' })   // 카메라가 있는 건물에 표시
    // 카메라 핀을 누르면 부모로 { type:'camera-select', id, loc }, '영상 보기'를 누르면 { type:'camera-open', id }

  주소 끝에 ?ui=minimal 을 붙이면 제목 카드와 하단 버튼을 숨겨요.
*/
(() => {
'use strict';
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; return; }
if (new URLSearchParams(location.search).get('ui') === 'minimal') document.body.classList.add('minimal');

const isMobile = Math.min(innerWidth, innerHeight) < 700;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.75 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe6e4, 450, 1700);
const camera = new THREE.PerspectiveCamera(45, 1, .5, 5000);

/* ---------- 유틸 ---------- */
let _s = 7311;
function rnd() { _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s >>> 15), 1 | _s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function speckle(g, w, h, n, a) { for (let i = 0; i < n; i++) { const v = rnd() < .5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${a * rnd()})`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); } }
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO; return t;
}
function scaleUV(geo, sx, sy) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sx, uv.getY(i) * sy); uv.needsUpdate = true; }
function boxUV(geo, w, h, d, ku, kv) {
  const uv = geo.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * dims[f][0] * ku, uv.getY(i) * dims[f][1] * kv); }
  uv.needsUpdate = true;
}
const Lm = o => new THREE.MeshLambertMaterial(o);
const dummy = new THREE.Object3D();
const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1), UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 8);
function box(w, h, d, mat, x, y, z, parent, uvk) {
  const geo = new THREE.BoxGeometry(w, h, d); if (uvk) boxUV(geo, w, h, d, uvk[0], uvk[1]);
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function inst(geo, list, mat, fn) {
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach((a, i) => { fn(a); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); });
  im.castShadow = im.receiveShadow = true; scene.add(im); return im;
}
const instBoxes = (list, mat) => inst(UNIT_BOX, list, mat, ([x, y, z, w, h, d, ry]) => { dummy.position.set(x, y + h / 2, z); dummy.rotation.set(0, ry || 0, 0); dummy.scale.set(w, h, d); });
const instCyl = (list, mat) => inst(UNIT_CYL, list, mat, ([x, y, z, r, h]) => { dummy.position.set(x, y + h / 2, z); dummy.rotation.set(0, 0, 0); dummy.scale.set(r, h, r); });
function plane(w, d, mat, x, y, z, ku, kv) {
  const geo = new THREE.PlaneGeometry(w, d); geo.rotateX(-Math.PI / 2); if (ku) scaleUV(geo, ku, kv);
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
}

/* ---------- 텍스처 ---------- */
const N = 8, S = 64;
const lit = Array.from({ length: N * N }, () => rnd() < .55);
const winTex = canvasTex(N * S, N * S, g => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, N * S, N * S);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = c * S, y = r * S;
    g.fillStyle = '#dcd8cf'; g.fillRect(x, y + S - 5, S, 5);
    g.fillStyle = '#3a4550'; g.fillRect(x + 12, y + 14, 40, 28);
    g.fillStyle = '#8ea0ae'; g.fillRect(x + 14, y + 16, 17, 24); g.fillRect(x + 33, y + 16, 17, 24);
    g.fillStyle = '#b9b4a8'; g.fillRect(x + 10, y + 42, 44, 3);
  }
});
const winEm = canvasTex(N * S, N * S, g => {
  g.fillStyle = '#000'; g.fillRect(0, 0, N * S, N * S);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (lit[r * N + c]) { g.fillStyle = rnd() < .3 ? '#ffd998' : '#fff0cc'; g.fillRect(c * S + 13, r * S + 15, 38, 26); }
});
const roadTex = canvasTex(64, 256, (g, w, h) => {
  g.fillStyle = '#45484b'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1500, .12);
  g.fillStyle = '#e8e2c8'; g.fillRect(w / 2 - 1.5, 0, 3, h * .5);
});
const grassTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#7a8f55'; g.fillRect(0, 0, w, h); for (let i = 0; i < 7000; i++) { const l = rnd(); g.fillStyle = `rgba(${l < .5 ? '60,80,40' : '150,165,100'},${.15 + rnd() * .15})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); } });
const paradeTex = canvasTex(512, 384, (g, w, h) => {
  g.fillStyle = '#b8a27c'; g.fillRect(0, 0, w, h); speckle(g, w, h, 9000, .12);
  g.strokeStyle = 'rgba(245,242,230,.9)'; g.lineWidth = 4; g.strokeRect(14, 14, w - 28, h - 28);
  g.beginPath(); g.moveTo(w / 2, 14); g.lineTo(w / 2, h - 14); g.stroke();
  g.beginPath(); g.arc(w / 2, h / 2, 46, 0, 7); g.stroke();
});
const fenceTex = canvasTex(64, 64, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.strokeStyle = '#ffffff'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(w, h); g.moveTo(w, 0); g.lineTo(0, h); g.stroke();
});
const metalTex = canvasTex(64, 64, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 8) { g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(x, 0, 2, h); g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(x + 3, 0, 1, h); } });
const stripeTex = canvasTex(128, 16, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#f2f0ea' : '#c8322a'; g.fillRect(i * 16, 0, 16, h); } });
const crossTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.fillStyle = '#d02b25'; g.fillRect(48, 18, 32, 92); g.fillRect(18, 48, 92, 32); });
const flagTex = canvasTex(300, 200, g => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 300, 200);
  const cx = 150, cy = 100, D = 100, R = D / 2, th = Math.atan2(2, 3);
  g.save(); g.translate(cx, cy); g.rotate(th);
  g.fillStyle = '#CD2E3A'; g.beginPath(); g.arc(0, 0, R, Math.PI, 2 * Math.PI); g.fill();
  g.fillStyle = '#0047A0'; g.beginPath(); g.arc(0, 0, R, 0, Math.PI); g.fill();
  g.fillStyle = '#CD2E3A'; g.beginPath(); g.arc(-R / 2, 0, R / 2, 0, 2 * Math.PI); g.fill();
  g.fillStyle = '#0047A0'; g.beginPath(); g.arc(R / 2, 0, R / 2, 0, 2 * Math.PI); g.fill();
  g.restore();
  const t = D / 12, L = D / 2, gap = D / 24;
  const tri = (phi, bars) => {
    g.save(); g.translate(cx, cy); g.rotate(phi); g.fillStyle = '#000';
    bars.forEach((solid, k) => {
      const x = D * .75 + k * (t + gap);
      if (solid) g.fillRect(x, -L / 2, t, L); else { const s = (L - gap) / 2; g.fillRect(x, -L / 2, t, s); g.fillRect(x, gap / 2, t, s); }
    });
    g.restore();
  };
  tri(Math.PI + th, [1, 1, 1]); tri(th, [0, 0, 0]); tri(-th, [0, 1, 0]); tri(Math.PI - th, [1, 0, 1]);
});

const padTex = canvasTex(256, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.fillStyle = '#5f6466'; g.beginPath(); g.arc(128, 128, 126, 0, 7); g.fill();
  g.strokeStyle = '#f2efe4'; g.lineWidth = 9; g.beginPath(); g.arc(128, 128, 96, 0, 7); g.stroke();
  g.fillStyle = '#f2efe4'; g.fillRect(84, 70, 22, 116); g.fillRect(150, 70, 22, 116); g.fillRect(106, 117, 44, 22);
});
/* ---------- 재질 ---------- */
const MAT = {
  concrete: Lm({ color: 0xb9b6ad }),
  roofFlat: Lm({ color: 0x6d706d }),
  dark: Lm({ color: 0x2f3438 }),

    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    canvas.style.cursor = ray.intersectObjects(buildingMeshes, false).length ? 'pointer' : '';
  });
});

/* ---------- 외부 연동 API ---------- */
window.BaseMap = {
  list: () => BUILDINGS.map(b => ({ id: b.id, name: b.name, code: b.code })),
  alert: (id, message) => setAlert(id, message),
  clear: id => clearAlert(id),
  focus: id => { const b = find(id); if (!b) return false; selectBuilding(b.id, true); return true; },
  select: id => selectBuilding(id, false),
  overview: () => { selectBuilding(null); flyTo(HOME.cam, HOME.tgt); },
  setNight: on => { $('btnNight').setAttribute('aria-pressed', String(!!on)); setNight(!!on); },
  cameras: () => CAMERAS.map(c => { const b = c.bid ? find(c.bid) : null; return { id: c.id, loc: c.loc, bid: c.bid, bname: b ? b.name : null, live: !!c.live, state: c.state }; }),
  camState: (id, state, message) => setCamState(id, state, message),
  focusCam: id => selectCamera(id, true),
  setCams: on => { $('btnCams').setAttribute('aria-pressed', String(!!on)); setCams(!!on); },
  active: () => [...alerts.entries()].map(([id, a]) => ({ id, name: find(id).name, message: a.message, since: a.since })),
};
window.addEventListener('message', e => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'alert') { const id = m.id || (findCam(m.cam) || {}).bid; setAlert(id, m.message); if (m.focus !== false) BaseMap.focus(id); }
  else if (m.type === 'cam-state') setCamState(m.id, m.state, m.message);
  else if (m.type === 'cam-focus') selectCamera(m.id, true);
  else if (m.type === 'cams') BaseMap.setCams(m.on);
  else if (m.type === 'clear') clearAlert(m.id);
  else if (m.type === 'focus') BaseMap.focus(m.id);
  else if (m.type === 'overview') BaseMap.overview();
  else if (m.type === 'night') BaseMap.setNight(m.on);
});

/* ---------- 렌더 ---------- */
function resize() { const w = innerWidth, h = innerHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
{ const c = HOME.cam.clone(); if (camera.aspect < .8) c.sub(HOME.tgt).multiplyScalar(1.5).add(HOME.tgt); camera.position.copy(c); controls.target.copy(HOME.tgt); controls.update(); chipBtns.all.setAttribute('aria-current', 'true'); }

const v = new THREE.Vector3();
function updateLabels() {
  if (labelsEl.style.display === 'none') return;
  const W = innerWidth, H = innerHeight, camDist = camera.position.distanceTo(controls.target);
  for (const b of BUILDINGS) {
    const el = b.label;
    v.copy(b.anchor).project(camera);
    if (v.z > 1 || Math.abs(v.x) > 1.2 || Math.abs(v.y) > 1.2) { el.style.opacity = 0; el.style.pointerEvents = 'none'; continue; }
    const dist = camera.position.distanceTo(b.anchor);
    const op = alerts.has(b.id) ? 1 : Math.max(0, Math.min(1, 1.6 - dist / Math.max(260, camDist * 1.8)));
    el.style.opacity = op; el.style.pointerEvents = op > .2 ? 'auto' : 'none';
    el.style.transform = `translate(-50%,-100%) translate(${((v.x * .5 + .5) * W).toFixed(1)}px,${((-v.y * .5 + .5) * H).toFixed(1)}px)`;
    el.style.zIndex = String(alerts.has(b.id) ? 20000 : 10000 - Math.round(dist));
  }
}
function updateCamPins() {
  if (!camsOn) return;
  const W = innerWidth, H = innerHeight, camDist = camera.position.distanceTo(controls.target);
  for (const c of CAMERAS) {
    const el = c.pin;
    v.copy(c.anchor).project(camera);
    if (v.z > 1 || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1) { el.style.opacity = 0; el.style.pointerEvents = 'none'; continue; }
    const dist = camera.position.distanceTo(c.anchor), hot = c.state !== 'normal' || c === selectedCam;
    const op = hot ? 1 : Math.max(0, Math.min(1, 1.7 - dist / Math.max(250, camDist * 1.5)));
    el.style.opacity = op; el.style.pointerEvents = op > .2 ? 'auto' : 'none';
    el.style.transform = `translate(-50%,-100%) translate(${((v.x * .5 + .5) * W).toFixed(1)}px,${((-v.y * .5 + .5) * H).toFixed(1)}px)`;
    el.style.zIndex = String(hot ? 20000 : 10000 - Math.round(dist));
  }
}
let onScreen = true;
if ('IntersectionObserver' in window) new IntersectionObserver(es => { onScreen = es[es.length - 1].isIntersecting; }).observe(canvas);
const clock = new THREE.Clock();
let t = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05); t += dt;
  if (!onScreen || !innerWidth || !innerHeight) return;   // 화면에 안 보이는 동안(다른 탭 · 스크롤 밖)은 그리지 않음
  if (fly) {
    fly.k = Math.min(1, fly.k + dt / 1.5); const e = ease(fly.k);
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.k >= 1) fly = null;
  }
  controls.update();
  if (controls.target.y < 0) controls.target.y = 0;
  if (alerts.size) {
    const p = (Math.sin(t * 5) + 1) / 2, k = (t * .7) % 1;
    for (const id of alerts.keys()) {
      const fx = find(id).fx, R = find(id).size * .55 + 6;
      fx.ov.material.opacity = .12 + p * .28;
      fx.beam.material.opacity = .2 + p * .3;
      fx.ring.scale.setScalar(R * (.7 + k * .6)); fx.ring.material.opacity = .9 * (1 - k);
    }
  }
  for (const c of CAMERAS) if (c.state === 'hit') { const p = (Math.sin(t * 6) + 1) / 2; c.glow.scale.setScalar(.8 + p * .9); c.glow.material.opacity = .25 + p * .4; }
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  renderer.render(scene, camera);
  updateLabels(); updateCamPins();
}
loop();
})();
</script>
